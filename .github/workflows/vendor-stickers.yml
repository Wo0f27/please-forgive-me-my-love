name: Prepare transparent Peach and Goma stickers
on:
  push:
    branches: [feat/parchment-mobile-repair-v6]
permissions:
  contents: write
jobs:
  prepare-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/vendor_stickers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-peach-goma-reference
          path: .source-stickers/
          retention-days: 1
          if-no-files-found: ignore
      - name: Save fetched artwork in the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/stickers/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve approved stickers as local transparent PNGs"
            git push origin HEAD:feat/parchment-mobile-repair-v6
          else
            echo "No artwork changed"
          fi
