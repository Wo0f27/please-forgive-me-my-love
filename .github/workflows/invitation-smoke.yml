name: Invitation keyboard smoke QA
on:
  push:
    branches: [feat/fireworks-invitation-mobile-v11]
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -g "invitation buttons work with keyboard" --project=desktop-chromium
