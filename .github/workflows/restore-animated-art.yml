name: Restore animated Peach and Goma artwork
on:
  push:
    branches: [feat/restore-peach-goma-animation-v10]
    paths:
      - "tools/restore_animated_stickers.py"
      - ".github/workflows/restore-animated-art.yml"
permissions:
  contents: write
jobs:
  restore-art:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image conversion tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Restore original GIF frames as transparent lossless animations
        run: python tools/restore_animated_stickers.py
      - name: Upload artwork preview for visual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-art-previews
          path: .animated-sticker-previews/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Commit locally hosted animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stickers/*.webp assets/stickers/animations.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original Peach and Goma sticker animations as transparent WebP"
            git push origin HEAD:feat/restore-peach-goma-animation-v10
          fi
